<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Note Keeper</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, Arial, sans-serif;
        background: radial-gradient(circle at top left, #dbeafe, transparent 42%), #f8fafc;
        color: #172033;
      }

      .container {
        width: min(720px, 100%);
        padding: 38px;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        background: #ffffff;
        box-shadow: 0 22px 55px rgba(30, 41, 59, 0.14);
      }

      .tag {
        display: inline-block;
        margin-bottom: 12px;
        color: #2563eb;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 9px;
        font-size: clamp(28px, 5vw, 38px);
      }

      .intro {
        margin: 0 0 28px;
        color: #64748b;
        line-height: 1.55;
      }

      label {
        display: grid;
        gap: 8px;
        color: #334155;
        font-size: 14px;
        font-weight: 700;
      }

      input,
      textarea {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        background: #f8fafc;
        font: inherit;
        resize: vertical;
      }

      input:focus,
      textarea:focus {
        outline: 3px solid #bfdbfe;
        border-color: #2563eb;
        background: #ffffff;
      }

      textarea {
        min-height: 180px;
      }

      .comment-section {
        margin-top: 18px;
      }

      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 26px;
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 12px 17px;
        cursor: pointer;
        background: #2563eb;
        color: white;
        font: inherit;
        font-weight: 700;
      }

      button.secondary {
        background: #e2e8f0;
        color: #334155;
      }

      button.danger {
        margin-left: auto;
        background: #fff1f2;
        color: #be123c;
      }

      #status {
        min-height: 22px;
        margin: 20px 0 0;
        color: #15803d;
        font-size: 14px;
        font-weight: 700;
      }
    </style>
  </head>

  <body>
    <main class="container">
      <span class="tag">Personal workspace</span>
      <h1>Note Keeper</h1>
      <p class="intro">
        Write down your thoughts and keep them safely stored using the connected API.
      </p>

      <form id="notesForm">
        <label>
          Title
          <input id="title" type="text" placeholder="For example: Project meeting notes" />
        </label>

        <div class="comment-section">
          <label>
            Comment
            <textarea id="comment" placeholder="Write your note or comment here..."></textarea>
          </label>
        </div>

        <div class="buttons">
          <button type="button" id="saveButton">Save</button>
          <button type="button" id="loadButton" class="secondary">Load</button>
          <button type="button" id="updateButton">Update</button>
          <button type="button" id="clearButton" class="danger">Clear</button>
        </div>
      </form>

      <div id="status"></div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
